<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Bazar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f0f11);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --text-main: var(--tg-theme-text-color, #ffffff);
            --text-muted: var(--tg-theme-hint-color, #8e8e93);
            --accent: var(--tg-theme-button-color, #0a84ff);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            position: fixed;
            top: 0; bottom: 0; left: 0; right: 0;
            display: flex; 
            overflow: hidden; 
            font-size: 14px; 
        }

        /* Сайдбар */
        .sidebar { 
            width: 85px; 
            background-color: rgba(255, 255, 255, 0.03); 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 5px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            overflow-y: auto; 
            flex-shrink: 0;
        }
        
        .cat-btn { 
            background: transparent; border: none; color: var(--text-muted); 
            padding: 10px 2px; font-size: 10px; font-weight: 600; text-align: center; 
            border-radius: 10px; cursor: pointer; transition: all 0.2s ease; 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
        }
        .cat-btn .icon { font-size: 20px; }
        .cat-btn:active { transform: scale(0.95); }
        .cat-btn.active { background: var(--accent); color: var(--accent-text); }

        /* Основная часть */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        
        .header { 
            padding: 10px 12px; background: var(--bg-color); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0;
        }
        .search-box { 
            width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 10px; padding: 10px 14px; color: var(--text-main); font-size: 14px; outline: none; 
        }

        /* Сетка карточек */
        .ads-grid { 
            flex: 1; padding: 12px; 
            overflow-y: auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); 
            gap: 12px; 
            align-content: start;
            align-items: start; /* КРИТИЧЕСКИ ВАЖНО: запрещает растягивать карточки по высоте */
        }

        /* Карточка */
        .card { 
            background-color: var(--card-bg); 
            border-radius: 14px; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0; transform: translateY(10px);
            height: max-content; /* Карточка ровно по размеру контента */
        }
        
        /* Изображение */
        .img-container {
            width: 100%;
            height: 130px; /* Фиксированная высота, чтобы не ломалась сетка */
            background: #2c2c2e;
            position: relative;
            flex-shrink: 0;
        }
        .card-img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
        }

        .card-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        
        .card-cat { 
            font-size: 9px; font-weight: bold; background: rgba(10, 132, 255, 0.15); 
            color: var(--accent); padding: 3px 6px; border-radius: 4px; align-self: flex-start; 
        }
        .card-title { font-size: 13px; font-weight: 600; line-height: 1.2; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-car { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-oem { font-size: 10px; color: var(--text-muted); }
        
        .card-price-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 8px; gap: 5px;}
        .card-price { font-size: 15px; font-weight: 800; color: #30d158; }
        
        .contact-btn { 
            background-color: var(--accent); color: var(--accent-text); 
            border: none; padding: 6px 8px; border-radius: 8px; font-weight: 600; font-size: 11px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .empty-state { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 14px; grid-column: 1 / -1;}
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="cat-btn active" onclick="loadAds('all', this)"><span class="icon">🔥</span>Все</button>
        <button class="cat-btn" onclick="loadAds('Двигатель', this)"><span class="icon">⚙️</span>Двиг.</button>
        <button class="cat-btn" onclick="loadAds('Подвеска', this)"><span class="icon">🛞</span>Подвеска</button>
        <button class="cat-btn" onclick="loadAds('Кузов', this)"><span class="icon">🚪</span>Кузов</button>
        <button class="cat-btn" onclick="loadAds('Электрика', this)"><span class="icon">🔌</span>Электро</button>
        <button class="cat-btn" onclick="loadAds('Другое', this)"><span class="icon">📦</span>Другое</button>
    </div>

    <div class="main-content">
        <div class="header">
            <input type="text" id="searchInput" class="search-box" placeholder="Поиск (деталь, авто, OEM)..." oninput="handleSearch()">
        </div>
        <div class="ads-grid" id="ads-container">
            <div class="empty-state">Загрузка...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let allAds = []; 
        let currentCategory = 'all';
        const API_URL = 'https://autobazar-a22p.onrender.com/api/ads';

        async function fetchAds() {
            try {
                const response = await fetch(API_URL);
                allAds = await response.json();
                renderAds();
            } catch (error) {
                document.getElementById('ads-container').innerHTML = '<div class="empty-state">Ошибка загрузки данных. Нажмите, чтобы обновить.</div>';
            }
        }

        function loadAds(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentCategory = category;
            renderAds();
        }

        function handleSearch() { renderAds(); }

        function renderAds() {
            const container = document.getElementById('ads-container');
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            let filtered = allAds;
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(ad => ad.category === currentCategory);
            }

            if (searchText) {
                filtered = filtered.filter(ad => 
                    (ad.name && ad.name.toLowerCase().includes(searchText)) ||
                    (ad.oem && ad.oem.toLowerCase().includes(searchText)) ||
                    (ad.car_info && ad.car_info.toLowerCase().includes(searchText))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено.</div>';
                return;
            }

            filtered.forEach((ad, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`; 
                
                const imgSrc = ad.photo_url ? ad.photo_url : "https://cdn-icons-png.flaticon.com/512/3202/3202926.png";
                const carText = ad.car_info ? ad.car_info : 'Авто не указано';
                const priceText = ad.price ? ad.price : '0';
                const safeUsername = ad.username || ''; 
                
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${imgSrc}" class="card-img" alt="Фото" loading="lazy" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3202/3202926.png'">
                    </div>
                    <div class="card-body">
                        <span class="card-cat">${ad.category}</span>
                        <div class="card-title">${ad.name}</div>
                        <div class="card-car">🚘 ${carText}</div>
                        <div class="card-oem">OEM: ${ad.oem}</div>
                        <div class="card-price-row">
                            <div class="card-price">${priceText} ₴</div>
                            <button class="contact-btn" onclick="event.stopPropagation(); openChat(${ad.user_id}, '${safeUsername}')">💬 Чат</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openChat(userId, username) {
            if (username && username !== 'null' && username !== '') {
                tg.openTelegramLink(`https://t.me/${username}`);
            } else if (userId && userId !== 0) {
                tg.openTelegramLink(`tg://user?id=${userId}`);
            } else {
                tg.showAlert("Контакты этого продавца недоступны.");
            }
        }

        setTimeout(fetchAds, 200);
    </script>
</body>
</html>
