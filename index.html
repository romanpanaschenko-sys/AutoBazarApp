<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Bazar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f0f11);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --text-main: var(--tg-theme-text-color, #ffffff);
            --text-muted: var(--tg-theme-hint-color, #8e8e93);
            --accent: var(--tg-theme-button-color, #0a84ff);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        
        .sidebar { width: 90px; background-color: rgba(255, 255, 255, 0.03); border-right: 1px solid rgba(255, 255, 255, 0.05); padding: 12px 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; backdrop-filter: blur(10px); }
        .cat-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px 4px; font-size: 11px; font-weight: 500; text-align: center; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .cat-btn .icon { font-size: 18px; }
        .cat-btn:active { transform: scale(0.95); }
        .cat-btn.active { background: var(--accent); color: var(--accent-text); box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3); }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 12px 16px; background: var(--bg-color); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .search-box { width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px 14px; color: var(--text-main); font-size: 14px; outline: none; transition: border-color 0.2s; }
        .search-box:focus { border-color: var(--accent); }
        .search-box::placeholder { color: var(--text-muted); }

        .ads-grid { flex: 1; padding: 16px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; align-content: start; }
        .card { background-color: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05); animation: fadeIn 0.4s ease-out forwards; opacity: 0; transform: translateY(10px); }
        .img-container { width: 100%; height: 140px; background: #2c2c2e; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        
        .card-cat { font-size: 10px; font-weight: 600; background: rgba(10, 132, 255, 0.15); color: #0a84ff; padding: 4px 8px; border-radius: 6px; align-self: flex-start; margin-bottom: 4px; }
        .card-title { font-size: 14px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-car { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-oem { font-size: 11px; color: var(--text-muted); margin-bottom: 4px;}
        
        .card-price-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 8px;}
        .card-price { font-size: 16px; font-weight: 800; color: #30d158; }
        
        .contact-btn { background-color: var(--accent); color: var(--accent-text); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .contact-btn:active { opacity: 0.8; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .skeleton { background: #1c1c1e; border-radius: var(--border-radius); height: 260px; position: relative; overflow: hidden; }
        .skeleton::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: loading 1.5s infinite; }
        @keyframes loading { to { left: 100%; } }
        .empty-state { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 14px; padding: 0 20px;}
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="cat-btn active" onclick="loadAds('all', this)"><span class="icon">🔥</span>Все</button>
        <button class="cat-btn" onclick="loadAds('Двигатель', this)"><span class="icon">⚙️</span>Двиг.</button>
        <button class="cat-btn" onclick="loadAds('Подвеска', this)"><span class="icon">🛞</span>Подвеска</button>
        <button class="cat-btn" onclick="loadAds('Кузов', this)"><span class="icon">🚪</span>Кузов</button>
        <button class="cat-btn" onclick="loadAds('Электрика', this)"><span class="icon">🔌</span>Электро</button>
    </div>

    <div class="main-content">
        <div class="header">
            <input type="text" id="searchInput" class="search-box" placeholder="Поиск по детали, авто или OEM..." oninput="handleSearch()">
        </div>
        <div class="ads-grid" id="ads-container">
            <div class="skeleton"></div><div class="skeleton"></div>
            <div class="skeleton"></div><div class="skeleton"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let allAds = []; 
        let currentCategory = 'all';
        const API_URL = 'https://autobazar-a22p.onrender.com/api/ads';

        async function fetchAds() {
            try {
                const response = await fetch(API_URL);
                allAds = await response.json();
                renderAds();
            } catch (error) {
                document.getElementById('ads-container').innerHTML = '<div class="empty-state">Ошибка загрузки данных.</div>';
            }
        }

        function loadAds(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentCategory = category;
            renderAds();
        }

        function handleSearch() { renderAds(); }

        function renderAds() {
            const container = document.getElementById('ads-container');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            let filtered = allAds;
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(ad => ad.category === currentCategory);
            }

            if (searchText) {
                filtered = filtered.filter(ad => 
                    (ad.name && ad.name.toLowerCase().includes(searchText)) ||
                    (ad.oem && ad.oem.toLowerCase().includes(searchText)) ||
                    (ad.car_info && ad.car_info.toLowerCase().includes(searchText))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено.</div>';
                return;
            }

            filtered.forEach((ad, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`; 
                
                const imgSrc = ad.photo_url ? ad.photo_url : "https://cdn-icons-png.flaticon.com/512/3202/3202926.png";
                const carText = ad.car_info ? ad.car_info : 'Авто не указано';
                const priceText = ad.price ? ad.price : '0';
                const safeUsername = ad.username ? ad.username : ''; // Берем юзернейм
                
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${imgSrc}" class="card-img" alt="Запчасть" loading="lazy" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3202/3202926.png'">
                    </div>
                    <div class="card-body">
                        <span class="card-cat">${ad.category}</span>
                        <div class="card-title">${ad.name}</div>
                        <div class="card-car">🚘 ${carText}</div>
                        <div class="card-oem">OEM: ${ad.oem}</div>
                        <div class="card-price-row">
                            <div class="card-price">${priceText} ₴</div>
                            <button class="contact-btn" onclick="event.stopPropagation(); openChat(${ad.user_id}, '${safeUsername}')">💬 Чат</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Обновленная функция открытия чата (сначала по юзернейму, потом по ID)
        function openChat(userId, username) {
            if (username && username !== 'null' && username !== '') {
                tg.openTelegramLink(`https://t.me/${username}`);
            } else if (userId && userId !== 0) {
                try {
                    tg.openTelegramLink(`tg://user?id=${userId}`);
                } catch (e) {
                    tg.showAlert("Не удалось открыть чат. Возможно, у продавца закрыты личные сообщения.");
                }
            } else {
                tg.showAlert("Контакты этого продавца недоступны.");
            }
        }

        fetchAds();
    </script>
</body>
</html>
