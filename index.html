<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Bazar</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--tg-theme-bg-color, #18181b); color: var(--tg-theme-text-color, #ffffff); display: flex; height: 100vh; overflow: hidden; }
        
        /* Сайдбар слева */
        .sidebar { width: 100px; background-color: var(--tg-theme-secondary-bg-color, #27272a); padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .cat-btn { background: none; border: none; color: var(--tg-theme-hint-color, #a1a1aa); padding: 10px 5px; font-size: 12px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background-color: var(--tg-theme-button-color, #3b82f6); color: var(--tg-theme-button-text-color, #ffffff); font-weight: bold; }
        
        /* Контент справа */
        .content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: var(--tg-theme-secondary-bg-color, #27272a); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 5px; }
        .card-title { font-size: 16px; font-weight: bold; color: var(--tg-theme-text-color, #ffffff); }
        .card-oem { font-size: 12px; color: var(--tg-theme-hint-color, #a1a1aa); }
        .card-price { font-size: 18px; font-weight: bold; color: #22c55e; margin-top: 5px; }
        .card-cat { font-size: 11px; background: #3b82f6; color: white; padding: 3px 8px; border-radius: 10px; align-self: flex-start; }
        
        .loading { text-align: center; color: #a1a1aa; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="cat-btn active" onclick="loadAds('all', this)">Все</button>
        <button class="cat-btn" onclick="loadAds('Двигатель', this)">Двигатель</button>
        <button class="cat-btn" onclick="loadAds('Подвеска', this)">Подвеска</button>
        <button class="cat-btn" onclick="loadAds('Кузов', this)">Кузов</button>
        <button class="cat-btn" onclick="loadAds('Электрика', this)">Электрика</button>
    </div>

    <div class="content" id="ads-container">
        <div class="loading">Загрузка данных...</div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        let allAds = []; // Сюда сохраним все данные с сервера

        // Загрузка данных с нашего Python-сервера
        async function fetchAds() {
            try {
                // Замени ссылку на свою из Render, если она изменится
                const response = await fetch('https://autobazar-a22p.onrender.com/api/ads');
                allAds = await response.json();
                loadAds('all', document.querySelector('.cat-btn.active'));
            } catch (error) {
                document.getElementById('ads-container').innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
            }
        }

        // Отрисовка карточек на экране
        function loadAds(category, btnElement) {
            // Переключаем активную кнопку
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const container = document.getElementById('ads-container');
            container.innerHTML = '';

            // Фильтруем данные
            let filtered = allAds;
            if (category !== 'all') {
                filtered = allAds.filter(ad => ad.category === category);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading">В этой категории пока нет деталей.</div>';
                return;
            }

            // Создаем карточки
            filtered.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="card-cat">${ad.category}</span>
                    <div class="card-title">${ad.name}</div>
                    <div class="card-oem">OEM: ${ad.oem}</div>
                    <div class="card-price">${ad.price} грн</div>
                `;
                container.appendChild(card);
            });
        }

        // Запускаем загрузку при открытии
        fetchAds();
    </script>
</body>
</html>
