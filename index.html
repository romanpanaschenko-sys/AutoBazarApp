<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Bazar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--tg-theme-bg-color, #18181b); color: var(--tg-theme-text-color, #ffffff); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 100px; background-color: var(--tg-theme-secondary-bg-color, #27272a); padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .cat-btn { background: none; border: none; color: var(--tg-theme-hint-color, #a1a1aa); padding: 10px 5px; font-size: 12px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background-color: var(--tg-theme-button-color, #3b82f6); color: var(--tg-theme-button-text-color, #ffffff); font-weight: bold; }
        
        .content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: var(--tg-theme-secondary-bg-color, #27272a); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 140px; object-fit: contain; background: #1e1e1e; }
        .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        
        .card-car { font-size: 13px; font-weight: bold; color: #f59e0b; margin-bottom: 2px; } /* Желтый цвет для марки авто */
        .card-title { font-size: 16px; font-weight: bold; color: var(--tg-theme-text-color, #ffffff); }
        .card-oem { font-size: 12px; color: var(--tg-theme-hint-color, #a1a1aa); }
        .card-price { font-size: 18px; font-weight: bold; color: #22c55e; }
        .card-cat { font-size: 11px; background: #3b82f6; color: white; padding: 3px 8px; border-radius: 10px; align-self: flex-start; }
        
        .contact-btn { background-color: var(--tg-theme-button-color, #3b82f6); color: var(--tg-theme-button-text-color, #ffffff); border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer; width: 100%; }
        
        .loading { text-align: center; color: #a1a1aa; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="cat-btn active" onclick="loadAds('all', this)">Все</button>
        <button class="cat-btn" onclick="loadAds('Двигатель', this)">Двигатель</button>
        <button class="cat-btn" onclick="loadAds('Подвеска', this)">Подвеска</button>
        <button class="cat-btn" onclick="loadAds('Кузов', this)">Кузов</button>
        <button class="cat-btn" onclick="loadAds('Электрика', this)">Электрика</button>
    </div>

    <div class="content" id="ads-container">
        <div class="loading">Загрузка данных...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        let allAds = []; 

        const API_URL = 'https://autobazar-a22p.onrender.com/api/ads';

        async function fetchAds() {
            try {
                const response = await fetch(API_URL);
                allAds = await response.json();
                loadAds('all', document.querySelector('.cat-btn.active'));
            } catch (error) {
                document.getElementById('ads-container').innerHTML = '<div class="loading">Ошибка сервера. Попробуйте позже.</div>';
            }
        }

        function loadAds(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const container = document.getElementById('ads-container');
            container.innerHTML = '';

            let filtered = allAds;
            if (category !== 'all') {
                filtered = allAds.filter(ad => ad.category === category);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading">В этой категории пока нет деталей.</div>';
                return;
            }

            filtered.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = ad.photo_url ? ad.photo_url : "https://cdn-icons-png.flaticon.com/512/3202/3202926.png";
                
                card.innerHTML = `
                    <img src="${imgSrc}" class="card-img" alt="Запчасть">
                    <div class="card-body">
                        <div class="card-car">🚘 ${ad.car_info}</div>
                        <span class="card-cat">${ad.category}</span>
                        <div class="card-title">${ad.name}</div>
                        <div class="card-oem">OEM: ${ad.oem}</div>
                        <div class="card-price">${ad.price} грн</div>
                        <button class="contact-btn" onclick="openChat(${ad.user_id})">💬 Написать продавцу</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openChat(userId) {
            if (userId) {
                tg.openTelegramLink(`tg://user?id=${userId}`);
            } else {
                tg.showAlert("Контакты продавца недоступны.");
            }
        }

        fetchAds();
    </script>
</body>
</html>
